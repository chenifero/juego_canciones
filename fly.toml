# fly.toml app configuration file generated for barmagames on 2026-11-14T11:53:08+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'barmagames'
primary_region = 'cdg' # Madrid (mad) ya no existe en Fly: París

[build]
[env]
  DATA_DIR = '/data'
  PORT = '8080'
  SPOTIFY_REDIRECT_URI = 'https://barmagames.fly.dev/callback'
  WEB_ORIGIN = 'https://barmagames.fly.dev'

[[mounts]]
  source = 'barma_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # El bucle que vigila Spotify no puede dormirse: una máquina siempre encendida
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
